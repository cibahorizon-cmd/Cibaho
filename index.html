<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciba Horizon – Produits agricoles</title>
<meta name="description" content="Ciba Horizon commercialise des produits agricoles : engrais, insecticides, fongicides, herbicides et semences.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<style>
:root{--bg:#F7F9F8;--ink:#0D1F17;--muted:#52645B;--line:#DDE6E1;--card:#fff;--em:#0A5C3E;--em2:#0E7A52;--emt:#0A5C3E;--mint:#DDF2E6;--sun:#FFD23F;--on-sun:#2B2300;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08130E;--ink:#EAF4EE;--muted:#9BB3A6;--line:#1B3226;--card:#0F1F17;--emt:#7FDCAA;--mint:#133522}}
:root[data-theme="dark"]{--bg:#08130E;--ink:#EAF4EE;--muted:#9BB3A6;--line:#1B3226;--card:#0F1F17;--emt:#7FDCAA;--mint:#133522}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.04rem;line-height:1.6}
h1,h2,h3{font-family:Outfit,"Trebuchet MS",system-ui,sans-serif;line-height:1.08;letter-spacing:-.025em;margin:0}
h1{font-weight:800}h2{font-weight:700}h3{font-weight:700;letter-spacing:-.01em}
h1:focus{outline:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.narrow{max-width:640px}
.sr{position:absolute;left:-9999px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;height:58px}
.brand{margin-right:auto;font-family:Outfit,sans-serif;font-weight:800;font-size:1.3rem;text-decoration:none;display:flex;align-items:center;gap:9px}
.brand i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 66% 34%,var(--sun) 0 27%,var(--em) 29%)}
header nav{display:none;gap:4px;font-weight:700;font-size:.95rem}
header nav a{text-decoration:none;color:var(--muted);padding:8px 14px;border-radius:999px}
header nav a[aria-current]{background:var(--mint);color:var(--emt)}
.bd{background:var(--sun);color:var(--on-sun);border-radius:999px;padding:0 7px;margin-left:4px;font-size:.8rem}
@media(min-width:760px){header nav{display:flex}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs a{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;text-decoration:none;color:var(--muted);padding:7px 0;border-radius:14px}
.tabs a[aria-current]{background:var(--mint);color:var(--emt)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs b{position:absolute;top:2px;left:calc(50% + 6px);background:var(--sun);color:var(--on-sun);font-size:.68rem;border-radius:999px;padding:0 6px}
@media(min-width:760px){.tabs{display:none}}

.hero{position:relative;overflow:hidden;background:var(--em);color:#fff;padding:48px 0 96px}
.hero::before{content:"";position:absolute;right:-22%;top:-16%;width:min(86vw,600px);aspect-ratio:1;border-radius:50%;background:var(--em2)}
.hero::after{content:"";position:absolute;right:7%;top:26px;width:min(18vw,110px);min-width:64px;aspect-ratio:1;border-radius:50%;background:var(--sun)}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:clamp(2.4rem,9.5vw,4.8rem);max-width:11ch;letter-spacing:-.035em;line-height:1}
.hero p{max-width:38ch;font-size:1.1rem;margin:20px 0 26px;color:#D6EBDF}
.in{animation:up .9s .1s ease-out both}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.phead{position:relative;overflow:hidden;background:var(--em);color:#fff;padding:34px 0 30px}
.phead::after{content:"";position:absolute;right:6%;top:50%;width:64px;height:64px;margin-top:-32px;border-radius:50%;background:var(--sun)}
.phead .wrap{position:relative;z-index:1}
.phead h1{font-size:clamp(1.8rem,6vw,3rem)}
.phead .lead{color:#CFE8DA;margin:8px 0 0;max-width:30ch}

.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:14px 22px;border-radius:16px;font-weight:700;text-decoration:none;border:2px solid transparent;color:inherit}
button.btn{font:inherit;font-weight:700;cursor:pointer;background:none}
.btn.main{background:var(--sun);color:var(--on-sun)}
.btn.em{background:var(--em);color:#fff}
.btn.alt{border-color:currentColor}
section{padding:56px 0}
section.s0{padding-top:28px}
section.alt{background:var(--mint)}
h2{font-size:clamp(1.7rem,5vw,2.6rem);margin-bottom:12px}
.lead{color:var(--muted);max-width:52ch;margin:0 0 26px}

.exs{padding:0;margin-top:-56px;position:relative;z-index:2}
.ex{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 12px 40px rgba(6,40,25,.12)}
.ex h2{font-size:1.5rem;margin-bottom:14px}
.ex .items li{background:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chips a,.chip{white-space:nowrap;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;font-size:.9rem;text-decoration:none;cursor:pointer}
.chips [aria-current],.chips [aria-pressed="true"]{background:var(--em);border-color:var(--em);color:#fff}
.mq{overflow:hidden;white-space:nowrap;background:var(--sun);color:var(--on-sun);font-family:Outfit,sans-serif;font-weight:700;font-size:1.05rem;margin-top:56px}
.mq div{display:inline-block;padding:14px 0;animation:mq 40s linear infinite}
.mq span::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--em);margin:0 20px}
@keyframes mq{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.in,.mq div{animation:none}.mq{overflow-x:auto}}

.ico{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 26%,var(--card));color:var(--ink)}
.ico svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.items{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
@media(min-width:760px){.items{grid-template-columns:1fr 1fr}}
.items li{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:20px}
.items li.none{display:block;color:var(--muted)}
.items .t{flex:1 1 150px;min-width:0}
.items h3{font-size:1.05rem}
.items p{margin:3px 0 0;color:var(--muted);font-size:.93rem}
.add{margin-left:auto;font:inherit;font-weight:700;font-size:.9rem;padding:9px 15px;border-radius:12px;border:0;background:var(--mint);color:var(--emt);cursor:pointer}
.add.on{background:var(--em);color:#fff}
.search{width:100%;font:inherit;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.vals,.steps{display:grid;gap:18px;margin:0;padding:0;list-style:none}
@media(min-width:760px){.vals{grid-template-columns:repeat(3,1fr)}.steps{grid-template-columns:repeat(4,1fr)}}
.vals div{border-left:4px solid var(--sun);padding-left:16px}
.vals h3{font-size:1.2rem;margin-bottom:4px}
.vals p{margin:0;color:var(--muted)}
.steps{counter-reset:s}
.steps li{counter-increment:s;background:var(--card);border-radius:22px;padding:18px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--em);color:#fff;font-family:Outfit,sans-serif;font-weight:800;margin-bottom:10px}
.steps b{display:block}.steps span{color:var(--muted);font-size:.96rem}
.cta{position:relative;overflow:hidden;background:var(--em);color:#fff;border-radius:30px;padding:40px 24px}
.cta::after{content:"";position:absolute;right:-34px;bottom:-34px;width:150px;height:150px;border-radius:50%;background:var(--sun)}
.cta>*{position:relative;z-index:1}
.cta p{max-width:34ch;color:#D6EBDF;margin:0 0 22px}

.cart{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:10px}
.cart li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.cart small{display:block;color:var(--muted)}
.q{display:flex;align-items:center;gap:12px}
.q button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1.2rem;cursor:pointer}
form label{display:block;font-weight:700;margin:16px 0 6px}
form input,form textarea{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#err{font-weight:700;min-height:1.6em;margin:12px 0 4px}
.contact-box{background:var(--em);color:#EAF6EF;border-radius:26px;padding:28px}
.contact-box a{color:#fff;font-weight:700}
footer{border-top:1px solid var(--line);padding:24px 0 100px;color:var(--muted);font-size:.92rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
@media(min-width:760px){footer{padding-bottom:24px}}
.ph{margin:0}.ph img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:26px}.ph figcaption{color:var(--muted);font-size:.93rem;margin-top:10px}
.gal{display:grid;gap:14px;align-items:start}@media(min-width:760px){.gal{grid-template-columns:1fr 1fr}}.gal figure{margin:0}.gal img{display:block;width:100%;height:auto;border-radius:22px}.gal figcaption{color:var(--muted);font-size:.93rem;margin-top:8px}
.items .btn{margin-left:auto;padding:10px 18px}
.pk{flex:none;width:92px;height:92px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--card))}.pk svg{width:68px;height:76px}.lg{width:32px;height:32px;flex:none}
</style>
</head>
